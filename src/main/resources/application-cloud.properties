#appConfig
app.prefix=/user-management-service
app.title=JBAT UserManagement Service
server.servlet.context-path=/user-management-service/api

#datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username={SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.maximumPoolSize=${SPRING_DATASOURCE_MAXIMUMPOOLSIZE}
spring.datasource.poolName=cgat-usermanagement-ds


spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.jpa.properties.hibernate.default_schema=usermanagement
spring.flyway.schemas=usermanagement

spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#okta config
okta.baseurl=${OKTA_BASEURL}
okta.protocol=oauth2
okta.authServerId=${OKTA_AUTHSERVERID}
okta.clientId=${OKTA_CLIENTID}
okta.redirectUri=/login/callback
okta.endSessionRedirectUri=/login
okta.scopes=openid,email,profile,offline_access
okta.state={'LANGUAGE':'en'}
okta.audience=${OKTA_AUDIENCE}
okta.token.inline.hook.auth.token=${OKTA_HOOK_AUTH_TOKEN}

#port
server.port=8082

# Logging
logging.level.root=info
logging.pattern.console=%d{dd-MM-yyyy HH:mm:ss.SSS} %magenta([%thread]) %highlight(%-5level) - %X{correlation_id} %X{user_id} %msg%n

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

filter.enabled=true
