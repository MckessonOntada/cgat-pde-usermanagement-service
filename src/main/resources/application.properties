#appConfig
app.prefix=/user-management-service
app.title=JBAT UserManagement Service
server.servlet.context-path=/user-management-service/api
#port
server.port=8082

usermanagementservice.base.url=http://localhost:8082/user-management-service/api

#datasource
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.url=jdbc:postgresql://localhost:5432/global
spring.datasource.maximumPoolSize=20
spring.datasource.poolName=cgat-usermanagement-ds
 
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.jpa.properties.hibernate.default_schema=usermanagement
spring.flyway.schemas=usermanagement
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1MB
#spring.servlet.multipart.max-request-size=-1
 
# JPA settings
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# basic log level for all messages
#    logging.level.org.hibernate=info
# SQL statements and parameters
# logging.level.org.hibernate.SQL=debug
# logging.level.org.hibernate.orm.jdbc.bind=trace
 
