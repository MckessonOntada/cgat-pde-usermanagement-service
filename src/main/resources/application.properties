#appConfig
app.prefix=/user-management-service
app.title=JBAT UserManagement Service
server.servlet.context-path=/user-management-service/api
#port
server.port=8082
 
#datasource
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.url=jdbc:postgresql://localhost:5432/global
spring.datasource.maximumPoolSize=20
spring.datasource.poolName=jbat-usermanagement-ds
 
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.jpa.properties.hibernate.default_schema=usermanagement
spring.flyway.schemas=usermanagement
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.driver-class-name=org.postgresql.Driver
 
# JPA settings
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
#okta config
okta.baseurl=https://ikmg2.oktapreview.com
okta.protocol=oauth2
okta.authServerId=aus15z2gtyeApTTXf1d7
okta.clientId=0oa8z4dc5eTkZTisf1d7
okta.redirectUri=/login/callback
okta.endSessionRedirectUri=/login
okta.scopes=openid,email,profile,offline_access
okta.state={'LANGUAGE':'en'}
okta.token.inline.hook.auth.header=x-okta-auth
okta.token.inline.hook.auth.token=x-okta-token
okta.audience:https://localhost:8080
# Logging
logging.level.root=info
logging.pattern.console=%d{dd-MM-yyyy HH:mm:ss.SSS} %magenta([%thread]) %highlight(%-5level) - %X{correlation_id} %X{user_id} %msg%n
 
 
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
chart.abstraction.service.base.url=http://jbat-chart-abstraction-service-dev-svc:8082/data-abstraction-service

spring.security.user.name =admin
spring.security.user.password=admin@123
filter.enabled=true

