
---
apiVersion: v1
kind: Secret
metadata:
  name: cgat-pde-usermanagement-service-secret-dev
  namespace: ontada-cgat-pde-dev
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
  SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
  SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
  SPRING_DATASOURCE_MAXIMUMPOOLSIZE: "${SPRING_DATASOURCE_MAXIMUMPOOLSIZE}"
  OKTA_BASEURL: "${OKTA_BASEURL}"
  OKTA_CLIENTID: "${OKTA_CLIENTID}"
  OKTA_AUTHSERVERID: "${OKTA_AUTHSERVERID}"
  NOTIFICATION_REST_CLIENT_URL: "https://cgat-pde-dev.mckesson.com/notification-service/"
  NOTIFICATION_LINK_PDE_PORTAL: "https://cgat-pde-dev.mckesson.com/"
  NOTIFICATION_SUPPORT_CONTACT: "${NOTIFICATION_SUPPORT_CONTACT}"
  BLOB_CONTAINER_LINK: "https://cgatepdedevsftp1.blob.core.windows.net/cgatepdedevdata?sp=racwdl&st=2024-12-17T16:56:54Z&se=2025-07-28T23:56:54Z&spr=https&sv=2022-11-02&sr=c&sig=9CbgR4TyWpGHTjRCtkcSGOmoT1M3wxW47wSxJkZfwCw%3D"
  NOTIFICATION_SUPPORT_EMAIL: "${NOTIFICATION_SUPPORT_EMAIL}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgat-pde-usermanagement-service
  namespace: ontada-cgat-pde-dev
  labels:
    backstage.io/kubernetes-id: cgat-pde-usermanagement-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cgat-pde-usermanagement-service
  template:
    metadata:
      labels:
        app: cgat-pde-usermanagement-service
        backstage.io/kubernetes-id: cgat-pde-usermanagement-service
        appContact: 'piyush_ranjan'
        team: 'CGAT'
        appVersion: '${IMAGE_TAG}'
        workflow: '${WORKFLOW_ID}'
    spec:
      containers:
        - name: cgat-pde-usermanagement-service
          image: "${DOCKER_REGISTRY}/cgat-pde-usermanagement-service:${IMAGE_TAG}"
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /user-management-service/api/actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 10
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /user-management-service/api/actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 10
          ports:
            - containerPort: 8082
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 400Mi
          envFrom:
              - secretRef:
                  name: cgat-pde-usermanagement-service-secret-dev
          env:
          - name: SPRING_PROFILES_ACTIVE
            value: "cloud"
          - name: JAVA_OPTS
            value: "-XX:MaxRAMPercentage=75"
      imagePullSecrets:
        - name: docker-registry-credentials
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: cgat-pde-usermanagement-service-dev-svc
  namespace: ontada-cgat-pde-dev
  labels:
    app: cgat-pde-usermanagement-service
    backstage.io/kubernetes-id: cgat-pde-usermanagement-service
spec:
  ports:
    - protocol: TCP
      port: 8082
  selector:
    app: cgat-pde-usermanagement-service
  type: ClusterIP