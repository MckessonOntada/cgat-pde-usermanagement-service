
---
apiVersion: v1
kind: Secret
metadata:
  name: cgat-pde-usermanagement-service-secret-stage
  namespace: ontada-cgat-pde-stage
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
  SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
  SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
  SPRING_DATASOURCE_MAXIMUMPOOLSIZE: "${SPRING_DATASOURCE_MAXIMUMPOOLSIZE}"
  OKTA_BASEURL: "${OKTA_BASEURL}"
  OKTA_CLIENTID: "${OKTA_CLIENTID}"
  OKTA_AUTHSERVERID: "${OKTA_AUTHSERVERID}"


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgat-pde-usermanagement-service
  namespace: ontada-cgat-pde-stage
  labels:
    backstage.io/kubernetes-id: cgat-pde-usermanagement-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cgat-pde-usermanagement-service
  template:
    metadata:
      labels:
        app: cgat-pde-usermanagement-service
        backstage.io/kubernetes-id: cgat-pde-usermanagement-service
        appContact: 'piyush_ranjan'
        team: 'CGAT'
        appVersion: '${IMAGE_TAG}'
        workflow: '${WORKFLOW_ID}'
    spec:
      containers:
        - name: cgat-pde-usermanagement-service
          image: "${DOCKER_REGISTRY}/cgat-pde-usermanagement-service:${IMAGE_TAG}"
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /user-management-service/api/actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 10
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /user-management-service/api/actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 10
          ports:
            - containerPort: 8082
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 400Mi
          envFrom:
              - secretRef:
                  name: cgat-pde-usermanagement-service-secret-stage
          env:
          - name: SPRING_PROFILES_ACTIVE
            value: "cloud"
          - name: JAVA_OPTS
            value: "-XX:MaxRAMPercentage=75"
      imagePullSecrets:
        - name: docker-registry-credentials
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: cgat-pde-usermanagement-service-stage-svc
  namespace: ontada-cgat-pde-stage
  labels:
    app: cgat-pde-usermanagement-service
    backstage.io/kubernetes-id: cgat-pde-usermanagement-service
spec:
  ports:
    - protocol: TCP
      port: 8082
  selector:
    app: cgat-pde-usermanagement-service
  type: ClusterIP