---
apiVersion: v1
kind: Secret
metadata:
  name: cgat-pde-usermanagement-service-secret-qa
  namespace: ontada-cgat-pde-qa
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
  SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
  SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
  SPRING_DATASOURCE_MAXIMUMPOOLSIZE: "${SPRING_DATASOURCE_MAXIMUMPOOLSIZE}"
  OKTA_BASEURL: "${OKTA_BASEURL}"
  OKTA_CLIENTID: "${OKTA_CLIENTID}"
  OKTA_AUTHSERVERID: "${OKTA_AUTHSERVERID}"
  NOTIFICATION_REST_CLIENT_URL: "https://cgat-pde-qa.mckesson.com/notification-service/"
  NOTIFICATION_LINK_PDE_PORTAL: "https://cgat-pde-qa.mckesson.com/"
  NOTIFICATION_SUPPORT_CONTACT: "${NOTIFICATION_SUPPORT_CONTACT}"
  BLOB_CONTAINER_LINK: "https://cgatepdeqasftp1.blob.core.windows.net/cgatepdeqadata?sp=racwdl&st=2025-07-01T13:59:45Z&se=2027-07-01T21:59:45Z&spr=https&sv=2024-11-04&sr=c&sig=1Gdf9ms7lC3HOGnsE3K1ABX7QdRSDWgmwH1Yt7zcuOE%3D"
  CONTACT_US_SUPPORT_EMAIL: "PDE_Support@McKesson.com"
  NOTIFICATION_SUPPORT_EMAIL: "${NOTIFICATION_SUPPORT_EMAIL}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgat-pde-usermanagement-service
  namespace: ontada-cgat-pde-qa
  labels:
    backstage.io/kubernetes-id: cgat-pde-usermanagement-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cgat-pde-usermanagement-service
  template:
    metadata:
      labels:
        app: cgat-pde-usermanagement-service
        backstage.io/kubernetes-id: cgat-pde-usermanagement-service
        appContact: 'piyush_ranjan'
        team: 'CGAT'
        appVersion: '${IMAGE_TAG}'
        workflow: '${WORKFLOW_ID}'
    spec:
      containers:
        - name: cgat-pde-usermanagement-service
          image: "${DOCKER_REGISTRY}/cgat-pde-usermanagement-service:${IMAGE_TAG}"
          livenessProbe:
            failureThreshold: 6
            httpGet:
              path: /user-management-service/api/actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 10
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /user-management-service/api/actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 10
          ports:
            - containerPort: 8082
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 1
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 800Mi
          envFrom:
            - secretRef:
                name: cgat-pde-usermanagement-service-secret-qa
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "cloud"
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75"
      imagePullSecrets:
        - name: docker-registry-credentials
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: cgat-pde-usermanagement-service-qa-svc
  namespace: ontada-cgat-pde-qa
  labels:
    app: cgat-pde-usermanagement-service
    backstage.io/kubernetes-id: cgat-pde-usermanagement-service
spec:
  ports:
    - protocol: TCP
      port: 8082
  selector:
    app: cgat-pde-usermanagement-service
  type: ClusterIP
