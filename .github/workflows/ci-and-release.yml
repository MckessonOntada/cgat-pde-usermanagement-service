name: ci_pipeline

on:
  push:
    branches:
      - '**'

jobs:
  set_env:
    name: Setup Global Environments
    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY: "mck-ontada-sre.jfrog.io"
      JFROG_REPO_NAME: "cgat-pde-usermanagement-service"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setting Github Environment variables  
      - name: Set Docker Tags
        run: |
            echo "PROJECT_NAME=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 2)" >> $GITHUB_ENV
            echo "BRANCH_NAME=$(echo $GITHUB_REF_NAME)" >> $GITHUB_ENV
            echo "CURRENT_DATE_TIME=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV
            echo BUILD_NUMBER="${{ github.run_number }}" >> $GITHUB_ENV

      - name: Set sanitized branch name
        id: set-branch-name
        run: |
            BRANCH_NAME_SLUG=$(echo "${{ env.BRANCH_NAME }}" | sed 's:/:-:')
            echo "BRANCH_NAME_SLUG=$BRANCH_NAME_SLUG">> $GITHUB_ENV
            echo "Current branch ${{ env.BRANCH_NAME }}"
            echo "The branch name is: $BRANCH_NAME_SLUG"
            echo "BRANCH_NAME_SLUG=$BRANCH_NAME_SLUG" >> $GITHUB_OUTPUT


      # Exposing the Github Environment variables as the output to be used globaly in the workflow
      - name: Creating Major TAGs
        id: set_env
        run: |
          #  DOCKER_IMAGE_NAME=${{ env.DOCKER_REGISTRY }}/${{ env.JFROG_REPO_NAME }}/${{ steps.set-branch-name.outputs.BRANCH_NAME_SLUG }}
            DOCKER_IMAGE_NAME=${{ env.DOCKER_REGISTRY }}/${{ env.JFROG_REPO_NAME }}
            DOCKER_IMAGE_NAME=`echo $DOCKER_IMAGE_NAME | tr '[:upper:]' '[:lower:]'`
            echo DOCKER_IMAGE_NAME=$DOCKER_IMAGE_NAME >> $GITHUB_OUTPUT
            echo "DOCKER_TAG=${{ env.PROJECT_NAME }}-${{ steps.set-branch-name.outputs.BRANCH_NAME_SLUG }}-${{ env.CURRENT_DATE_TIME }}-${{ env.BUILD_NUMBER }}" >> $GITHUB_OUTPUT
            echo PROJECT_NAME=${{ env.PROJECT_NAME }} >> $GITHUB_OUTPUT
            echo BRANCH_NAME=${{ steps.set-branch-name.outputs.BRANCH_NAME_SLUG }} >> $GITHUB_OUTPUT
            echo CURRENT_DATE_TIME=${{ env.CURRENT_DATE_TIME }} >> $GITHUB_OUTPUT
            echo BUILD_NUMBER=${{env.BUILD_NUMBER }} >> $GITHUB_OUTPUT
    outputs:
      DOCKER_IMAGE_NAME: ${{ steps.set_env.outputs.DOCKER_IMAGE_NAME }}
      DOCKER_TAG: ${{ steps.set_env.outputs.DOCKER_TAG }}
      PROJECT_NAME: ${{ steps.set_env.outputs.PROJECT_NAME }}
      BRANCH_NAME: ${{ steps.set_env.outputs.BRANCH_NAME }}
      CURRENT_DATE_TIME: ${{ steps.set_env.outputs.CURRENT_DATE_TIME }}
      BUILD_NUMBER: ${{ steps.set_env.outputs.BUILD_NUMBER }}
      BRANCH_NAME_SLUG: ${{ steps.set-branch-name.outputs.BRANCH_NAME_SLUG }}


  build_maven_package:
    name: Build Maven Package
    runs-on: ubuntu-latest
    needs: set_env
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache JDK 17
        uses: actions/cache@v3
        with:
          path: ~/.sdkman/candidates/java
          key: jdk-17-${{ runner.os }}
          restore-keys: |
              jdk-17-

      - name: Set up JDK 17
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
         distribution: 'oracle'
         java-version: 17
         overwrite-settings: false


      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
               maven-${{ runner.os }}-

      - name: Build dependencies with Maven
        run: |
          cp settings.xml ~/.m2/
          mvn clean install -Dmaven.test.skip=true -Dmckesson_jfrog_server_username=${{ secrets.DEV_PORTAL_JFROG_USERNAME }} -Dmckesson_jfrog_server_password=${{ secrets.DEV_PORTAL_JFROG_API_KEY }}

      - name: Build with Maven
        run: mvn package spring-boot:repackage -Dmaven.test.skip=true  

        
      # - name: Build with Maven
      #   run: mvn clean package

      - name: Archive Maven Package and Dockerfile
        uses: actions/upload-artifact@v4
        with:
          name: jar_package
          path: |
            target/*.jar
            Dockerfile
            apiaccess-g2qa.mckesson.com.cer
            intermediary.cer
            ontadaroot.cer
            veracode/
          retention-days: 30

  prisma_scan:
    name: Prisma Docker Image Scanning
    runs-on: ubuntu-latest
    needs: [set_env, build_maven_package]
    env:
      DOCKER_REGISTRY: "mck-ontada-sre.jfrog.io"
      PRISMA_USER:  ${{ secrets.PRISMA_USER }}
      PRISMA_PASSWORD:  ${{ secrets.PRISMA_PASSWORD }}
      JFROG_PROJECT_NAME: "ontada" 
      JFROG_REPO_NAME: "cgat-pde-usermanagement-service"
      DOCKER_IMAGE_NAME: ${{ needs.set_env.outputs.DOCKER_IMAGE_NAME }}
      DOCKER_TAG: ${{ needs.set_env.outputs.DOCKER_TAG }}
      PROJECT_NAME: ${{ needs.set_env.outputs.PROJECT_NAME }}
      #RELEASE_VERSION: ${{ needs.set_env.outputs.RELEASE_VERSION }}
      BRANCH_NAME: ${{ needs.set_env.outputs.BRANCH_NAME }}
      CURRENT_DATE_TIME: ${{ needs.set_env.outputs.CURRENT_DATE_TIME }}
      BUILD_NUMBER: ${{ needs.set_env.outputs.BUILD_NUMBER }}
      BRANCH_NAME_SLUG: ${{ needs.set_env.outputs.BRANCH_NAME_SLUG }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Download Mavne Package from Build Job
        uses: actions/download-artifact@v4
        with:
          name: jar_package

      - name: Setup Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Login to JFrog
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DEV_PORTAL_JFROG_USERNAME }}
          password: ${{ secrets.DEV_PORTAL_JFROG_API_KEY }}
          registry: ${{ env.DOCKER_REGISTRY }}          

      - name: Docker Build
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
            ${{ env.DOCKER_IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          cache-to: type=inline
          load: true

      - name: Download Wiz CLI
        run: curl -L -o wizcli https://downloads.wiz.io/wizcli/latest/wizcli-linux-amd64 && chmod +x wizcli
                                  
      - name: Authenticate to Wiz
        env:
          WIZ_CLIENT: ${{ secrets.WIZ_CLIENT }}
          WIZ_SECRET: ${{ secrets.WIZ_SECRET }}
        run: |
          ls
          ./wizcli auth --id ${{ env.WIZ_CLIENT }} --secret ${{ env.WIZ_SECRET }}

      - name: Run wiz-cli docker image scan
        id: scan-docker-image
        run: |
          WIZ_IMAGE_POLICY="McKesson Vulnerability Scanner Policy"
          ./wizcli docker scan --image ${{ env.DOCKER_IMAGE_NAME }} --policy "$WIZ_IMAGE_POLICY"

     # - name: Generate wiz-cli Docker Image Scan report
     #   id: scan
     #   run: |
     #     ./wizcli docker scan --image ${{ env.DOCKER_IMAGE_NAME }} --policy "$WIZ_IMAGE_POLICY" >> scan_output.txt
     #     echo "printing the report"
     #     cat scan_output.txt

     # - name: Analyze Scan Output
     #   id: analyze
     #   run: |
     #     CRITICAL_COUNT=$(grep -o 'CRITICAL' scan_output.txt | wc -l)
     #     echo "CRITICAL vulnerabilities found: $CRITICAL_COUNT"
     #     if [ $CRITICAL_COUNT -gt 5 ]; then
     #       echo "More than 5 CRITICAL vulnerabilities found. Failing the workflow."
     #       # exit 1
     #     fi

     # - name: Upload wiz-cli Scan Output
     #   id: Upload-wiz-cli-scan-Output
     #   uses: actions/upload-artifact@v4
     #   if: always()
     #   with:
     #     name: wiz-cli-scan-results-${{ env.PROJECT_NAME }}-${{ env.BRANCH_NAME_SLUG }}-${{ env.CURRENT_DATE_TIME }}-${{ env.BUILD_NUMBER }}
     #     path: scan_output.txt

      - name: Login to Jfrog
        uses: jfrog/setup-jfrog-cli@v3
        if: github.ref == 'refs/heads/master_ph' || startsWith(github.ref, 'refs/heads/release-')
        env:
          JF_URL: https://${{ env.DOCKER_REGISTRY }}
          JF_USER: ${{ secrets.DEV_PORTAL_JFROG_USERNAME }}
          JF_PASSWORD: ${{ secrets.DEV_PORTAL_JFROG_API_KEY }}

      - name: View and Upload Images to Artifactory
        if: github.ref == 'refs/heads/master_ph' || startsWith(github.ref, 'refs/heads/release-')
        run: |
          docker images
          #jf docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_NUMBER }} --project ${{ env.JFROG_PROJECT_NAME }}
          #jf docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }} --build-number=${{ env.BUILD_NUMBER }} --project ${{ env.JFROG_PROJECT_NAME }}
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
 

  release_version:
    name: Pre Relaease Creation
    runs-on: ubuntu-latest
    needs: [set_env, build_maven_package, prisma_scan]
    if: always() && needs.verracode_scan.result != 'failure' && needs.prisma_scan.result != 'failure' && needs.build_maven_package.result != 'failure' && needs.set_env.result != 'failure'
    env:
      DOCKER_TAG: ${{ needs.set_env.outputs.DOCKER_TAG }}
      BRANCH_NAME: ${{ needs.set_env.outputs.BRANCH_NAME }}
      PROJECT_NAME: ${{ needs.set_env.outputs.PROJECT_NAME }}
      #RELEASE_VERSION: ${{ needs.set_env.outputs.RELEASE_VERSION }}
      CURRENT_DATE_TIME: ${{ needs.set_env.outputs.CURRENT_DATE_TIME }}
      BUILD_NUMBER: ${{ needs.set_env.outputs.BUILD_NUMBER }}
      BRANCH_NAME_SLUG: ${{ needs.set_env.outputs.BRANCH_NAME_SLUG }}     
    steps:
      - name: Debug
        run: |
          echo "branch: ${{ env.BRANCH_NAME_SLUG }}"

     # - name: Download Prisma Artifact
     #   uses: actions/download-artifact@v4
     #   with:
     #     name: wiz-cli-scan-results-${{ env.PROJECT_NAME }}-${{ env.BRANCH_NAME_SLUG }}-${{ env.CURRENT_DATE_TIME }}-${{ env.BUILD_NUMBER }}
     #     path: ./upload-artifacts

      - name: Create Prerelease
        uses: ncipollo/release-action@v1
        if: github.ref == 'refs/heads/master_ph' || startsWith(github.ref, 'refs/heads/release-')
        with:
          artifacts: "./upload-artifacts/*"
          prerelease: true
          tag: ${{ env.PROJECT_NAME }}-${{ env.BRANCH_NAME }}-${{ env.CURRENT_DATE_TIME }}-${{ env.BUILD_NUMBER }}
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: ${{ github.sha }}
